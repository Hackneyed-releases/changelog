name: Generate Changelog

on:
  workflow_dispatch:
    inputs:
      codename:
        description: 'Select the file to update'
        required: true
        type: choice
        options:
          - denver.txt
          - kiev.txt
          - larry.txt
          - luigi.txt
          - oscar.txt
          - oscarc.txt
          - oscarru.txt
          - oscaro.txt
      commit_message:
        description: 'Custom commit message'
        required: true
      fetch_date:
        description: 'Last Updated Date in DD-MM-YYYY format'
        required: true
      current_date:
        description: 'Current Date in DD-MM-YYYY format for output'
        required: true

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install -r bin/requirements.txt

    - name: Run changelog generation script
      run: |
        source venv/bin/activate
        python bin/gen_change.py
      env:
        TARGET_GITHUB_TOKEN: ${{ secrets.TARGET_GITHUB_TOKEN }}
        FETCH_DATE: ${{ github.event.inputs.fetch_date }}
        CURRENT_DATE: ${{ github.event.inputs.current_date }}
        GITHUB_INPUT_CODENAME: ${{ github.event.inputs.codename }}

    - name: Overwrite selected text file
      run: |
        codename="${{ github.event.inputs.codename }}"
        if [ -f "$codename" ]; then
          echo "Overwriting $codename with new content"
          cat change.txt > "$codename"
        else
          echo "File $codename not found, skipping."
        fi

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add "${{ github.event.inputs.codename }}"
        git commit -m "${{ github.event.inputs.commit_message }}"
        git push
